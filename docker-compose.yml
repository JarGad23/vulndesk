services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: vulndesk
      POSTGRES_PASSWORD: vulndesk
      POSTGRES_DB: vulndesk
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vulndesk"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  db-data:
